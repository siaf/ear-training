<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicons/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicons/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15101c" media="(prefers-color-scheme: dark)" />
    <style>
      html, body { background: #fff8ef; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #15101c; }
    </style>

    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fifths" />

    <!-- Fonts: Outfit (UI) + DM Serif Display (display, incl. italic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" />

    <title>Fifths · Ear Training</title>

    <!-- Google tag (gtag.js) — web only. Capacitor injects window.Capacitor
         before any script runs, so we can skip loading gtag inside the iOS /
         Android WebView. Native users have no gclid/utm context anyway, so
         their gtag pageviews would just pollute GA4 as "(direct)" traffic. -->
    <script>
      (function () {
        var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (isNative) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-LJYKXFDR9L';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        // Sign-in returns with tokens in the address (see src/lib/redactAuth.ts); report the
        // page without them.
        var tokens = /\b(access_token|refresh_token|provider_token|provider_refresh_token)=[^&#\s"'\\]*/g;
        var page = location.href.indexOf('_token=') === -1 ? {} : { page_location: location.href.replace(tokens, '$1=redacted') };
        window.gtag('config', 'G-LJYKXFDR9L', page);
        window.gtag('config', 'AW-17007845333', page);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
